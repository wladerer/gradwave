# fcc Al SCF for the k-sharding scaling sweep (benchmarks/distributed/scaling.py).
# symmetry off: the distributed path shards the full mesh (512 k), so the
# per-rank share is nk / world_size exactly and the sweep measures pure
# k-parallel scaling. Gaussian smearing: metal.
structure:
  cell: [[0.0, 2.025, 2.025], [2.025, 0.0, 2.025], [2.025, 2.025, 0.0]]
  positions: {frac: [[0.0, 0.0, 0.0]]}
  species: [Al]

pseudopotentials:
  dir: ../../tests/fixtures/qe/pseudos
  map: {Al: Al_ONCV_PBE-1.2.upf}

ecut: 544.228          # eV (40 Ry)
xc: pbe
kpoints: {mesh: [8, 8, 8]}
smearing: {type: gaussian, width: 0.1}
symmetry: false
distributed: true

scf:
  etol: 1.0e-8
  rhotol: 1.0e-7

task: scf
output: {dir: ./out_scaling}
