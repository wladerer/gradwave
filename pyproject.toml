[tool.ty.overrides.rules]
all = "error"

[tool.ruff]
line-length = 100
target-version = "py311"
# experiments/ holds throwaway probe/scratch scripts (not shipped, not imported).
# They are exempt from lint so a docs-ish PR that adds one can't turn main lint-red
# repo-wide (the lint CI job is path-filtered off for docs-only changes, so an
# unlinted scratch .py otherwise sneaks in and every later code PR inherits it).
extend-exclude = ["experiments"]

[tool.ruff.lint]
# High-value, low-noise families for a perf-sensitive numerical codebase.
# Deliberately EXCLUDES opinionated/noisy families (ARG, FBT, TRY, PLR*, ANN,
# D, EM, TD, ERA, COM) that false-positive heavily on scientific code.
select = [
    "E", "F", "W", "I", "NPY", "B",
    "PERF",  # perflint — real wins for numerical hot paths
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
    "RET",   # flake8-return
    "UP",    # pyupgrade
    "RUF",   # ruff-specific
    "PIE",   # flake8-pie
    "FLY",   # flynt (static str-join → f-string)
    "ISC",   # implicit-str-concat
    "C901",  # mccabe complexity (ratchet, see [tool.ruff.lint.mccabe])
]
ignore = [
    "E741",  # l is a perfectly good angular momentum variable
    # jaxtyping shape annotations ("n1 n2 n3") are a DSL, not Python
    # expressions — ruff's forward-annotation parser always flags them.
    "F722",
    # Ambiguous-unicode rules are pure false-positives here: this is a physics
    # codebase whose docstrings/comments/strings deliberately use U+2212 MINUS,
    # Greek letters (α, χ, τ, …), ×, →, ℏ and other math glyphs. Renaming them
    # to ASCII look-alikes would corrupt the science being documented.
    "RUF001",  # ambiguous char in string
    "RUF002",  # ambiguous char in docstring
    "RUF003",  # ambiguous char in comment
    # RUF059: unused unpacked variable (`a, b = f()` with b unused). Unpacking
    # to descriptive names documents a multi-return API even when one value is
    # unused at a given call site; forcing `_` hurts readability. Noisy here.
    "RUF059",
    # C408: unnecessary-collection-call (`dict(a=1)` -> `{"a": 1}`). This code
    # deliberately uses the keyword `dict(...)` form as a compact, aligned
    # config-table idiom in ~260 places (benchmark/test case tables, option
    # dicts). The rewrite is behaviour-preserving but pure churn and breaks the
    # visual alignment. Keep the rest of C4 (comprehension rules) on.
    "C408",
    # RUF046: unnecessary-cast-to-int (`int(math.ceil(...))`). Every hit is in
    # numerical grid-sizing code (FLAPW/FFT box dimensions, occupation counts)
    # where the explicit int() documents that a grid *count* is intended; the
    # fix is unsafe-marked and touches arithmetic we will not perturb without
    # running the suite. Deferred; behaviour must stay bit-identical here.
    "RUF046",
    # PERF401: manual-list-comprehension. A real perf lever, but all 21 src hits
    # are numerical accumulation loops in scf/postscf; a mechanical loop->comp
    # rewrite is only provably behaviour-preserving with test coverage, which
    # this lint pass does not run. Left for a focused, test-backed PR. The rest
    # of PERF (PERF101/102/203/402, …) stays on.
    "PERF401",
]

[tool.ruff.lint.per-file-ignores]
# The non-library tree (benchmark drivers, runnable examples, one-off scripts,
# and tests) is held to the same correctness rules but exempted from a few
# style/refactor rules that only ever fire there and would be churn:
#   UP031  printf-style % formatting in log/plot strings
#   SIM105 bare try/except/pass (contextlib.suppress adds no value in a script)
#   SIM115 open() without a context manager (short-lived read/plot scripts)
#   RUF034 useless if-else in a benchmark data table
#   RUF043 / ISC002 pytest match= metacharacters / multi-line implicit concat
#          in assertion-message strings — test-authoring conveniences
"benchmarks/**" = ["UP031", "SIM115", "RUF034"]
"examples/**" = ["SIM115"]
"scripts/**" = ["UP031", "SIM105", "SIM115"]
"tests/**" = ["SIM115", "RUF043", "ISC002"]

[tool.ruff.lint.mccabe]
# Ratchet: set just above the current worst offenders (_relax_nested / scf_uspp
# at 43) so this BLOCKS new complexity while grandfathering existing
# god-functions. Lower it as those functions get decomposed; never raise it.
max-complexity = 44

[tool.codespell]
# Spell-check for code/comments/docstrings. Run: uv run codespell (wired as a
# pre-commit hook). The ignore list is deliberately small and each entry is a
# real domain token, a code identifier, a proper name, or a load-bearing typo
# *fixture* — NOT a licence to leave real typos unfixed.
#   physics / notation : precessing (spin precession), braket (bra-ket),
#                        ontop (adsorption site), fom (figure of merit),
#                        oint (contour integral ∮), sme
#   proper names       : cances (Cancès), soler (J. Soler), botton (G. Botton)
#   journal abbrevs    : mater (Comput. Mater.), commun, numer
#   code identifiers   : bu, ois, gud, acn, abl, cna, nd, rin, te, ba, als,
#                        hda, iterm, nin, ket, bra
#   typo-detection     : optimzer, convergance  (intentional bad keys that the
#     fixtures            input validator/tests assert are rejected with a hint)
#   valid word         : pre-empts
ignore-words-list = "precessing,braket,ontop,fom,oint,sme,cances,soler,botton,mater,commun,numer,bu,ois,gud,acn,abl,cna,nd,rin,te,ba,als,hda,iterm,nin,ket,bra,optimzer,convergance,pre-empts"
# *.upf pseudopotentials ship a "discription" typo in their UPF headers (vendor
# data, not ours to edit); locks/generated/binary assets have nothing to check.
skip = "*.json,*.lock,uv.lock,*.svg,*.upf,.git,*.test_durations,docs/symbols.txt"

[tool.importlinter]
root_package = "gradwave"

# Architecture boundaries, encoded from the layering the modules document in
# prose. Run with: uv run lint-imports
[[tool.importlinter.contracts]]
name = "flapw is a self-contained leaf (constants/kpoints/symmetry only)"
type = "forbidden"
source_modules = ["gradwave.flapw"]
forbidden_modules = [
    "gradwave.scf",
    "gradwave.postscf",
    "gradwave.api",
    "gradwave.solvers",
    "gradwave.pseudo",
    "gradwave.io",
    "gradwave.inputs",
]

[[tool.importlinter.contracts]]
name = "core stays independent of the SCF and analysis layers"
type = "forbidden"
source_modules = ["gradwave.core"]
forbidden_modules = ["gradwave.scf", "gradwave.postscf"]
# TYPE_CHECKING-only edges from the core/ typing pass (Phase 6): each annotates
# a `system`/`res` parameter with its real scf.loop type (System, SCFResult) but
# never imports it at runtime, so no actual circular import exists — same
# pattern, same carve-out mechanism, as the scf -> postscf contract below.
ignore_imports = [
    "gradwave.core.hubbard -> gradwave.scf.loop",
    "gradwave.core.spinor_proj -> gradwave.scf.loop",
    "gradwave.core.xc.learnable -> gradwave.scf.loop",
]

[[tool.importlinter.contracts]]
name = "inputs is a leaf (schema + parsing only, no physics imports)"
type = "forbidden"
source_modules = ["gradwave.inputs"]
forbidden_modules = [
    "gradwave.api", "gradwave.core", "gradwave.scf", "gradwave.postscf",
    "gradwave.solvers", "gradwave.pseudo", "gradwave.opt",
]

[[tool.importlinter.contracts]]
name = "api is the top of the stack (physics layers do not import it)"
type = "forbidden"
source_modules = [
    "gradwave.core", "gradwave.scf", "gradwave.postscf", "gradwave.solvers",
    "gradwave.pseudo", "gradwave.opt", "gradwave.inputs",
]
forbidden_modules = ["gradwave.api"]
# Function-scoped late imports, deliberate late binding to break the cycle
# (the api drivers import these packages at module level):
ignore_imports = [
    "gradwave.postscf.response -> gradwave.api",
    "gradwave.opt.line_search -> gradwave.api",
]

[[tool.importlinter.contracts]]
name = "pseudo is a leaf package"
type = "forbidden"
source_modules = ["gradwave.pseudo"]
forbidden_modules = ["gradwave.core", "gradwave.scf", "gradwave.postscf", "gradwave.solvers"]

[[tool.importlinter.contracts]]
name = "solvers stay low-level (no SCF/analysis deps)"
type = "forbidden"
source_modules = ["gradwave.solvers"]
forbidden_modules = ["gradwave.scf", "gradwave.postscf"]

[[tool.importlinter.contracts]]
name = "scf does not depend on the analysis layer, except the shared response kernels"
type = "forbidden"
source_modules = ["gradwave.scf"]
forbidden_modules = ["gradwave.postscf"]
# scf.loop -> postscf.hybrid is TYPE_CHECKING-only (the `fock: MultiKFockExchange
# | None` annotation on scf()): postscf.hybrid imports scf() back, so importing
# it for real here would be circular, not just architecturally backwards.
ignore_imports = [
    "gradwave.scf.implicit -> gradwave.postscf._response",
    "gradwave.scf.alchemical -> gradwave.postscf._response",
    "gradwave.scf.loop -> gradwave.postscf._response",
    "gradwave.scf.uspp_loop -> gradwave.postscf._response",
    "gradwave.scf.noncollinear -> gradwave.postscf._response",
    "gradwave.scf.soft_mode -> gradwave.postscf._response",
    "gradwave.scf.loop -> gradwave.postscf.hybrid",
]
