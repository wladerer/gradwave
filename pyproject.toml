[project]
name = "gradwave"
version = "0.1.0"
description = "Differentiable plane-wave DFT for periodic solids in PyTorch"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Will Laderer", email = "wtladerer@gmail.com" }]
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "scipy>=1.12",
    "ase>=3.23",
    "pyyaml>=6",
    "spglib>=2.4",
    "jaxtyping>=0.3.11",
    "beartype>=0.22.9",
    "typing-extensions>=4.16.0",
]

[project.optional-dependencies]
# gradwave.analysis (frames + plotting) imports these lazily; the core
# package and CLI run without them. Install with: gradwave[analysis]
analysis = [
    "pandas>=3.0.3",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist",
    "pytest-split>=0.8",  # shard the CI standard tier across parallel runners
    "ruff>=0.6",
    "sympy>=1.12",
    "pre-commit>=3.5",
    # libxc oracle for the r2SCAN pointwise tests (bundles libxc via its wheel);
    # tests importorskip it, so it is optional — this just enables them in CI.
    "pyscf>=2.4",
    "import-linter>=2.13",
    "hypothesis>=6.160.0",
    "ty>=0.0.64",
    "monkeytype>=23.3.0",
    "autotyping>=24.9.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[project.scripts]
gradwave = "gradwave.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gradwave"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -n auto parallelizes across cores via pytest-xdist; pass -n0 to disable when
# debugging a single test and interleaved output gets in the way.
addopts = "-q -n auto"
markers = [
    "standard: seconds-class integration tests, excluded from the fast gate",
    "slow: minutes-class QE-comparison tests, nightly or pre-release",
    "torture: tests over ~10 minutes (spin and FD monsters), run manually when their subsystem changes",
    "gpu: requires CUDA device",
]
# Tiers. A test carries at most one tier
# marker; unmarked tests are the fast tier by definition.
#   fast gate (<2 min):  pytest -m "not standard and not slow and not torture and not gpu"
#   standard / CI:       pytest -m "not slow and not torture and not gpu"
#   nightly:             pytest -m "not torture and not gpu"
#   torture (manual):    pytest -m torture

[tool.ty.environment]
python = ".venv"

[tool.ty.terminal]
# Findings in the untyped bulk of the codebase are demoted to warnings below,
# not silenced; don't let those (expected, pre-existing) warnings fail the
# exit code the way an actual error still does.
error-on-warning = false

[tool.ty.rules]
# Gradual typing rollout (see CLAUDE.md): "warn" everywhere by default so the
# many pre-existing findings across the untyped bulk of the codebase stay
# visible (not silenced) without failing CI — this rollout does not (yet) ask
# anyone to clean those up. The override below raises the same rules back to
# "error" for the growing, explicitly-typed file list, so a regression THERE
# still fails the build. A single override block is the obviously-editable
# spot to grow as more files get typed in later phases.
all = "warn"

[[tool.ty.overrides]]
include = [
    "src/gradwave/api.py",
    "src/gradwave/calculator.py",
    "src/gradwave/inputs.py",
    "src/gradwave/cli.py",
    # Phase 3: System/USPPSystem's object-typed fields (grid, batch, sym,
    # rho_symmetrizer, becsum_sym, alchemical) are now precisely typed. That
    # unblocked mixing.py (the smallest Phase-2-typed scf/ driver — cleaned up
    # for real: paired-Optional narrowing via assert, @override decorators, a
    # Tensor|float widening on step_scale) and spin_precond.py (mechanical
    # autotyping only, verified clean by actually adding it to this list and
    # checking — do not infer cleanliness from a file's absence here, since an
    # unlisted file never shows an `error[...]`, clean or not).
    #
    # loop.py, uspp_loop.py, noncollinear.py, and the other 9 mechanically
    # autotyped scf/ files (common.py, layout.py, learned_precond.py,
    # local_tf.py, paw_onsite.py, paw_symmetry.py, setup_common.py,
    # uspp_batch.py, uspp_noncollinear.py) were each individually verified NOT
    # clean this round (1-31 real errors apiece: bare list/dict generics, the
    # SCF loop's "runs >=1 iteration" possibly-unresolved-reference pattern,
    # and — uspp_loop.py/uspp_noncollinear.py especially — deeper
    # argument-type mismatches) and are deliberately left off.
    "src/gradwave/scf/mixing.py",
    "src/gradwave/scf/spin_precond.py",
    #
    # Phase 4: autotyping + MonkeyType over postscf/ (2x scf/'s size, the
    # largest untyped subpackage), same recipe as the scf/ pilot. 32 of the
    # 49 touched postscf/ files verified genuinely clean this round (added
    # to this list one at a time, per the same "an unlisted file never
    # shows an error[...]" discipline as the note above):
    "src/gradwave/postscf/bader.py",
    "src/gradwave/postscf/bands.py",
    "src/gradwave/postscf/composition_design.py",
    "src/gradwave/postscf/convergence_error.py",
    "src/gradwave/postscf/convex_hull.py",
    "src/gradwave/postscf/coulomb_kernel.py",
    "src/gradwave/postscf/dispersion_d4.py",
    "src/gradwave/postscf/dispersion.py",
    "src/gradwave/postscf/dos.py",
    "src/gradwave/postscf/elastic.py",
    "src/gradwave/postscf/eos.py",
    "src/gradwave/postscf/exchange_multik.py",
    "src/gradwave/postscf/exchange.py",
    "src/gradwave/postscf/hessian.py",
    "src/gradwave/postscf/hybrid.py",
    "src/gradwave/postscf/isdf_k.py",
    "src/gradwave/postscf/isdf.py",
    "src/gradwave/postscf/_kb.py",
    "src/gradwave/postscf/lattice_mc.py",
    "src/gradwave/postscf/magnetism.py",
    "src/gradwave/postscf/moment_config.py",
    "src/gradwave/postscf/phase_diagram.py",
    "src/gradwave/postscf/phonons.py",
    "src/gradwave/postscf/phonons_supercell.py",
    "src/gradwave/postscf/qha.py",
    "src/gradwave/postscf/_response.py",
    "src/gradwave/postscf/response.py",
    "src/gradwave/postscf/spin_exchange.py",
    "src/gradwave/postscf/stress_error.py",
    "src/gradwave/postscf/thermo.py",
    "src/gradwave/postscf/uspp_bands.py",
    "src/gradwave/postscf/uspp_frozen.py",
    #
    # Deliberately left off (individually verified NOT clean — hundreds of
    # real errors between them, not just the untyped-bulk warning noise):
    # cohp.py, dielectric.py, discretization_error.py, forces.py,
    # hubbard_u.py, irreps.py, mae.py, newton.py, paw_forces.py,
    # paw_stress.py, pdos.py, scf/results.py, stress.py, _strain.py,
    # uspp_implicit.py, uspp_position.py, volumetric.py. The common root
    # causes: (a) a handful of shared dict-literal "site" records
    # (sites.append({"atom":.., "l":.., "dim":..}), int/float mixed per
    # key) that need a TypedDict, not a plain dict[str, int | float]
    # (_strain.py, paw_forces.py, uspp_position.py); (b) XC-union dispatch
    # — calling xc.energy(...) generically over XCFunctional | SpinXC fails
    # because the two classes' energy() signatures genuinely differ in
    # arity/shape, so the call needs an isinstance branch first, not a
    # wider parameter type (paw_forces.py, hubbard_u.py, dielectric.py);
    # (c) discretization_error.py/newton.py/uspp_implicit.py's own
    # DiscretizationError/USPPResult-adjacent dataclasses carry the same
    # bare-list/tuple-invariance debt loop.py/uspp_loop.py have above. Real
    # follow-up work, not a quick fix — left off rather than forced.
    #
    # Phase 6: autotyping + MonkeyType over core/ (30 files, the most-
    # imported subpackage). 15 of the 27 non-empty touched files (+3
    # trivially-empty __init__.py) verified genuinely clean this round --
    # each tested individually (real ty check exit code, one file added at
    # a time), not inferred from the batch run:
    "src/gradwave/core/density.py",
    "src/gradwave/core/energies/ewald.py",
    "src/gradwave/core/energies/hartree.py",
    "src/gradwave/core/energies/__init__.py",
    "src/gradwave/core/energies/local_pp.py",
    "src/gradwave/core/fftbox.py",
    "src/gradwave/core/gamma.py",
    "src/gradwave/core/gaunt.py",
    "src/gradwave/core/hamiltonian.py",
    "src/gradwave/core/__init__.py",
    "src/gradwave/core/structure.py",
    "src/gradwave/core/xc/__init__.py",
    "src/gradwave/core/xc/noncollinear.py",
    "src/gradwave/core/xc/_pbe_kernels.py",
    "src/gradwave/core/ylm.py",
    #
    # Deliberately left off (individually verified NOT clean, 1-11 real
    # errors apiece): _anderson.py (Tensor|None arithmetic on
    # AndersonMixer.step), batch.py (bare dict/None-union unpacking in
    # BatchedHamiltonian._tables/_hub_tables), hubbard.py (bare list/dict
    # generics + the same TypedDict-shaped "site" dict-literal debt PR
    # #185 flagged in postscf/, + a BatchedK|None narrowing gap),
    # metagga.py/xc/spin.py/xc/r2scan.py (a torch.Tensor|float parameter
    # arithmetic pattern ty cannot narrow through), occupations.py/
    # xc/lda_pw92.py/xc/pbe.py/xc/r2scan.py/xc/spin.py (missing
    # @override on Smearing/XCFunctional/SpinXC subclass overrides),
    # spinor_proj.py (int|float|None arithmetic on UPF .j fields),
    # xc/base.py (Self-typed eval_energy_density cannot see
    # energy_density, a real base-class contract gap), xc/learnable.py
    # (softplus-parameterized kappa/mu returns Tensor where the PBE base
    # expects float). Real follow-up work, not a quick fix -- left off
    # rather than forced.
]

[tool.ty.overrides.rules]
all = "error"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "NPY", "B"]
ignore = [
    "E741",  # l is a perfectly good angular momentum variable
    # jaxtyping shape annotations ("n1 n2 n3") are a DSL, not Python
    # expressions — ruff's forward-annotation parser always flags them.
    "F722",
]

[tool.importlinter]
root_package = "gradwave"

# Architecture boundaries, encoded from the layering the modules document in
# prose. Run with: uv run lint-imports
[[tool.importlinter.contracts]]
name = "core stays independent of the SCF and analysis layers"
type = "forbidden"
source_modules = ["gradwave.core"]
forbidden_modules = ["gradwave.scf", "gradwave.postscf"]
# TYPE_CHECKING-only edges from the core/ typing pass (Phase 6): each annotates
# a `system`/`res` parameter with its real scf.loop type (System, SCFResult) but
# never imports it at runtime, so no actual circular import exists — same
# pattern, same carve-out mechanism, as the scf -> postscf contract below.
ignore_imports = [
    "gradwave.core.hubbard -> gradwave.scf.loop",
    "gradwave.core.spinor_proj -> gradwave.scf.loop",
    "gradwave.core.xc.learnable -> gradwave.scf.loop",
]

[[tool.importlinter.contracts]]
name = "pseudo is a leaf package"
type = "forbidden"
source_modules = ["gradwave.pseudo"]
forbidden_modules = ["gradwave.core", "gradwave.scf", "gradwave.postscf", "gradwave.solvers"]

[[tool.importlinter.contracts]]
name = "solvers stay low-level (no SCF/analysis deps)"
type = "forbidden"
source_modules = ["gradwave.solvers"]
forbidden_modules = ["gradwave.scf", "gradwave.postscf"]

[[tool.importlinter.contracts]]
name = "scf does not depend on the analysis layer, except the shared response kernels"
type = "forbidden"
source_modules = ["gradwave.scf"]
forbidden_modules = ["gradwave.postscf"]
# scf.loop -> postscf.hybrid is TYPE_CHECKING-only (the `fock: MultiKFockExchange
# | None` annotation on scf()): postscf.hybrid imports scf() back, so importing
# it for real here would be circular, not just architecturally backwards.
ignore_imports = [
    "gradwave.scf.implicit -> gradwave.postscf._response",
    "gradwave.scf.loop -> gradwave.postscf.hybrid",
]
