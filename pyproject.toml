    "src/gradwave/solvers/deflation.py",

    # Phase 13 (2026-08-26): the last 31 ungated modules, typed to zero
    # diagnostics — the gate is now the WHOLE of src/gradwave (206/206). Fixes
    # were annotation + narrowing only (parametrized generics, `cast`/`assert`
    # narrowing, a few ty-native `# ty: ignore[...]` for genuine limitations —
    # note ty does NOT honor the mypy `# type: ignore[...]` bracket form). The
    # big one was flapw/scf.py: real types on the `_MultiCtx` NamedTuple's
    # object-typed geometry/state fields cleared most of its cascade.
    "src/gradwave/flapw/scf.py",
