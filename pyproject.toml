    # experimental (default-off, measured-not-faster) sync_free path in
    # davidson_batched() carries ev/flag_host as `T | None` that are only
    # None when sync_free is False -- narrowed with `assert x is not None`
    # at each use, not a new runtime-checked wrapper, and only inside the
    # sync_free branch the hot default (non-sync_free) path never takes.
    "src/gradwave/solvers/__init__.py",
    "src/gradwave/solvers/_ms.py",
    "src/gradwave/solvers/precond.py",
