    #   * sum-of-Tensors over a generator types as `Tensor | Literal[0]` (the `0`
    #     start) and won't satisfy a strict-Tensor field/param -- rewritten as
    #     torch.stack([...]).sum(dim=0), numerically identical, in common.py's
