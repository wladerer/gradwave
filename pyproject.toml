    #     for what they actually call; retyped to `XCFunctional | SpinXC`
    #     with an `isinstance` narrow at each nspin==1/2 branch. A first
    #     pass narrowed the nspin==2 branch to `LSDA_PW92 | LearnableSpinX |
    #     SpinPBE` by name and shipped clean under ty -- but that's a real
    #     runtime bug, not just an annotation nicety: SPIN_XC_REGISTRY also
