    #     loop.py/uspp_loop.py had (Phase 9's `_IterStep`-style fix): cast()
    #     at each ambiguous coeffs/rho_ij_atoms extraction rather than a new
    #     TypedDict, since the ambiguity is a flattened `list[Tensor] |
    #     list[list[Tensor]]` union (nspin=1 vs 2), not a dict-shape one;
    #   * two real (not just untyped) bugs surfaced by making the types
