    #     that's actually exercised, with `cast` at the few remaining
    #     genuinely-ambiguous dict-value extraction points (same idiom, not
    #     a new pattern).
    "src/gradwave/scf/loop.py",
    "src/gradwave/scf/uspp_loop.py",
    "src/gradwave/scf/noncollinear.py",
    # Phase 11: the remaining 20 scf/ files (the empty __init__.py aside) --
    # closing the scf/ gap so the ENTIRE subpackage is now error-gated. 64 real
    # errors -> 0, verified by adding all 20 at once and driving the count down,
