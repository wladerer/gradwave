    # uspp_batch.py, uspp_noncollinear.py) were left off in this pilot round
    # (1-31 real errors apiece). The three central drivers landed in Phase 9;
    # the rest of scf/ (these nine and the remaining unlisted files) landed in
    # Phase 11 below, which closes the subpackage.
