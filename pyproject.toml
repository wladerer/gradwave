    #     `_pack_all`/`_unpack_all` called newton.py's `_pack`/`_unpack` with
    #     the PRE-nspin-generalization flat-argument convention (a bare
    #     Tensor/list instead of the per-spin list/list-of-lists those
    #     functions now require) -- silently "worked" only because torch's
    #     row-major reshape makes concatenated per-slab flattens equal a
    #     whole-tensor flatten, not because the call was actually correct;
    #     and cohp.py's `cohp()` dereferenced `res.v_eff` unconditionally for
    #     every nspin channel before checking `use_op`, so calling it on any
    #     USPPResult (the documented eigenvalue-route fallback) crashed with
    #     an AttributeError (USPPResult has no v_eff) regardless of
    #     `method=` -- moved the read inside `if use_op:`, both fixed to
    #     match the actually-intended contract, not papered over with casts;
    #   * stress.py's `_energy_strained`/dielectric.py's `dielectric_born`
    #     each had an implicit, never-enforced restriction to SCFResult on
    #     their post-is_fr-dispatch fallthrough path -- a scalar-relativistic
