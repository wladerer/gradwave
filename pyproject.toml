    # Deliberately left off: radial_torch.py. Its custom `_SBT(torch.autograd.
    # Function)` forward/backward are a genuine base-class contract gap, not
    # a quick fix -- torch's own stub types both as
    # `(ctx, *args: Any, **kwargs: Any) -> Any`, so giving them a concrete
    # signature (ctx: FunctionCtx, q: Tensor, ...) trips invalid-method-override
    # (arity narrows the base's *args, violating LSP) and missing-override-
    # decorator; FunctionCtx's dynamic ctx.l/ctx.saved_tensors attributes are
    # real at runtime (the documented save_for_backward/saved_tensors
    # contract) but aren't part of the stub either way. Left unannotated
    # (matching autotyping's own choice not to touch them) rather than forced.
    #
    # Phase 6 follow-up: the 12 core/ files left off in Phase 6, each
    # cleaned for real (real ty check exit code, one file added at a time
    # against this list, same discipline as every phase above) rather than
    # loosened to satisfy the checker:
    #  - _anderson.py: AndersonMixer.prev_u/prev_r are a paired Optional
    #    (both None only before the first step()); narrowed with
    #    `assert self.prev_u is not None` alongside the existing prev_r check.
    #  - batch.py: BatchedHamiltonian._tab_cache/_hub_cache needed real dict
    #    type args; _hub_tables() needed its own `assert hub_q/hub_dij is
    #    not None` (apply()'s guard narrows only apply()'s own locals, not
    #    the callee); density_b's `rho` is the same "loop runs >=1 iteration"
    #    pattern as scf/loop.py (nb >= 1 always) -- `assert rho is not None`.
    #  - hubbard.py: bare list/dict generics fixed with a new HubbardSite
    #    TypedDict (the {atom, l, u, j, start, dim} "site" record; also
    #    imported by postscf/_strain.py -- keep this name/shape stable),
    #    Callable given its real (int, Tensor) -> list[Tensor] signature,
    #    build_hubbard_projectors' `bk = system.batch` narrowed with an
    #    assert (DFT+U always runs the batched path). Along the way, found
    #    and fixed hubbard_occ_and_energy's `sum(... for n in n_hub)`,
    #    whose default start=0 made ty (correctly) infer Tensor | Literal[0]
    #    -- replaced with an explicit zero-Tensor accumulator, a real latent
    #    typing gap, not a false positive.
    #  - metagga.py: tau_b/spinor_tau_matrix_b's tau/tau_uu/tau_dd/tau_ud
    #    are the same "loop runs >=1 iteration" None-init pattern as
    #    batch.py's density_b -- asserted non-None after the band loop.
    #  - occupations.py: mechanical @override on the four Smearing
    #    subclasses (FermiDirac, Gaussian, MethfesselPaxton1,
    #    MarzariVanderbilt).
    #  - spinor_proj.py: so_projector_channels' `beta.j` and
    #    build_so_projectors' `so_tables` are only None-typed in general
    #    (UPF.j is Optional; System.so_beta_tables is Optional) but this
    #    whole module runs only in the fully-relativistic branch (callers
    #    gate on `system.is_fr`), so both get a real `assert x is not None`
    #    at the point they're known-set, plus real tuple/dict type args on
    #    the return/cache types.
    #  - xc/base.py: CompilableXC is a mixin with no energy_density of its
    #    own -- only the concrete XCFunctional/SpinXC subclasses (mixed in
    #    alongside it) supply one, with two DIFFERENT signatures. Giving
    #    CompilableXC its own `energy_density(*args)` stub "fixed" the
    #    Self-attribute gap but broke Liskov the other way (a subclass
    #    narrowing *args: object down to 3 typed params is not a valid
    #    override of the wider stub) -- ty caught this immediately as
    #    invalid-method-override. The actual fix: a TYPE_CHECKING-only
    #    `_HasEnergyDensity` Protocol (typing's documented pattern for
    #    exactly this "mixin requires a sibling method" shape) used only as
    #    an explicit self-type at the one call site in eval_energy_density
    #    that needs it (via `cast`, zero runtime cost) -- it does not enter
    #    the real class hierarchy, so it creates no override relationship
    #    for XCFunctional.energy_density/SpinXC.energy_density to violate.
    #  - xc/lda_pw92.py, xc/pbe.py, xc/r2scan.py, xc/spin.py: mechanical
    #    @override on each XCFunctional/SpinXC subclass's energy_density.
    #    Along the way, two real bugs surfaced and got fixed, not typed
    #    around: SpinR2SCAN.energy_density's None-guard checked only
    #    sigma_uu/tau_up while the body also uses sigma_dd/sigma_tot/tau_dn
    #    unchecked; SpinPBE.energy_density had no None-guard at all (unlike
    #    PBE's explicit ValueError) even though needs_gradient=True means
    #    the SCF always supplies sigma. Both now raise the same explicit
    #    ValueError as PBE instead of silently trusting the caller. Also:
    #    _pbe_kernels.py's `pbe_h(t2, eps_c_lda, phi3=1.0)` is genuinely
    #    dual-mode -- pbe.py's PBE passes the float default (unpolarized,
    #    φ=1), spin.py's SpinPBE passes a per-point Tensor (φ(ζ(r))³) -- so
    #    `phi3` is widened to `float | torch.Tensor` there (already
    #    strict-typed; re-verified clean after the change).
    #  - xc/learnable.py: `_inv_softplus`'s real bug was reassigning its own
    #    `float`-typed parameter `y` to a `torch.Tensor`, not (as first
    #    suspected) the kappa/mu Tensor-vs-float base-class question --
    #    that suspicion did not reproduce under a real per-file ty check
    #    once xc/pbe.py and xc/spin.py were in the same batch (PBE.kappa's
    #    own `self.kappa: float` resolves at the PBE class level for
    #    PBE.energy_density, unaffected by what a Learnable* subclass's
    #    property later returns) -- renamed the reassigned local instead of
    #    widening any signature.
    "src/gradwave/core/_anderson.py",
    "src/gradwave/core/batch.py",
    "src/gradwave/core/hubbard.py",
    "src/gradwave/core/metagga.py",
    "src/gradwave/core/occupations.py",
    "src/gradwave/core/spinor_proj.py",
    "src/gradwave/core/xc/base.py",
    "src/gradwave/core/xc/lda_pw92.py",
    "src/gradwave/core/xc/learnable.py",
    "src/gradwave/core/xc/pbe.py",
    "src/gradwave/core/xc/r2scan.py",
    "src/gradwave/core/xc/spin.py",
    # flapw: newton.py written fully typed from the start (its neighbors scf.py /
    # lapw.py remain untyped; State stays dict[str, Any] until they are).
    "src/gradwave/flapw/newton.py",
    # functionals.py (LDA/GGA radial kernels) is a pure-numeric leaf and
    # type-checks clean; nmr.py / recorder.py still carry error-level gaps.
    "src/gradwave/flapw/functionals.py",

    # Phase 12 (2026-08-26): 32 already-clean modules promoted in bulk. Each was
    # verified to type-check with ZERO diagnostics at error severity before being
    # listed (checked by adding it and running `ty check` — do not infer
    # cleanliness from a file's absence). Mostly leaf/data/glue: package roots and
    # __init__s, constants/dtypes, the _d3/_d4 dispersion parameter tables,
    # io/templates, and a set of flapw/postscf/scf leaves. Takes the error gate
    # from 143 → 175 of 206 modules. The 31 remaining ungated files carry real
    # error-level diagnostics and are left for follow-on typing work.
    "src/gradwave/__init__.py",
    "src/gradwave/_logging.py",
    "src/gradwave/_threads.py",
    "src/gradwave/_version.py",
    "src/gradwave/bench/__init__.py",
    "src/gradwave/constants.py",
    "src/gradwave/core/opcount.py",
    "src/gradwave/core/sphere_ff.py",
    "src/gradwave/dtypes.py",
    "src/gradwave/flapw/__init__.py",
    "src/gradwave/flapw/atom.py",
    "src/gradwave/flapw/basis.py",
    "src/gradwave/flapw/dfpt.py",
    "src/gradwave/flapw/efg_torch.py",
    "src/gradwave/flapw/mixing.py",
    "src/gradwave/io/__init__.py",
    "src/gradwave/io/templates.py",
    "src/gradwave/opt/__init__.py",
    "src/gradwave/postscf/__init__.py",
    "src/gradwave/postscf/_d3_params.py",
    "src/gradwave/postscf/_d4_params.py",
    "src/gradwave/postscf/_dispersion_geom.py",
    "src/gradwave/postscf/dfpt_q.py",
    "src/gradwave/postscf/efg_paw.py",
    "src/gradwave/postscf/gipaw.py",
    "src/gradwave/postscf/heisenberg_mc.py",
    "src/gradwave/postscf/seedpool.py",
    "src/gradwave/postscf/transport.py",
