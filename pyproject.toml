    #
    # Phase 6: autotyping + MonkeyType over core/ (30 files, the most-
    # imported subpackage). 15 of the 27 non-empty touched files (+3
    # trivially-empty __init__.py) verified genuinely clean this round --
    # each tested individually (real ty check exit code, one file added at
    # a time), not inferred from the batch run:
    "src/gradwave/core/density.py",
    "src/gradwave/core/energies/ewald.py",
    "src/gradwave/core/energies/hartree.py",
    "src/gradwave/core/energies/__init__.py",
    "src/gradwave/core/energies/local_pp.py",
    "src/gradwave/core/fftbox.py",
    "src/gradwave/core/gamma.py",
