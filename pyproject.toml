    "src/gradwave/scf/paw_noncollinear.py",
    "src/gradwave/scf/paw_onsite.py",
    "src/gradwave/scf/paw_symmetry.py",
    "src/gradwave/scf/recorder.py",
    "src/gradwave/scf/setup_common.py",
    "src/gradwave/scf/spinor_common.py",
    "src/gradwave/scf/uspp.py",
    "src/gradwave/scf/uspp_batch.py",
    "src/gradwave/scf/uspp_hubbard.py",
    "src/gradwave/scf/uspp_noncollinear.py",
    "src/gradwave/scf/uspp_setup.py",
    #
    # Phase 10: the 16 postscf/ files (+ scf/results.py) left off in the
    # Phase-4 postscf/ pass -- all 17 cleaned up for real (400+ real errors
    # -> 0 across them, verified individually), not just annotated around:
