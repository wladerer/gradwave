[project]
name = "gradwave"
version = "0.2.0"
description = "Differentiable plane-wave DFT for periodic solids in PyTorch"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Will Laderer", email = "wtladerer@gmail.com" }]
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "scipy>=1.12",
    "ase>=3.23",
    "pyyaml>=6",
    "spglib>=2.4",
    "jaxtyping>=0.3.11",
    "beartype>=0.22.9",
    "typing-extensions>=4.16.0",
]

[project.optional-dependencies]
# gradwave.io.analysis (frames + plotting) imports these lazily; the core
# package and CLI run without them. Install with: gradwave[analysis]
analysis = [
    "pandas>=3.0.3",
    "matplotlib>=3.8",
]
# gradwave.io.viz (pymatviz structure + periodic-table visuals) imports pymatviz
# lazily; the core package and CLI run without it. Install with: gradwave[viz].
# pymatviz pulls plotly and pymatgen, so it is deliberately kept out of the core.
viz = [
    "pymatviz>=0.17",
]
# gradwave.bench.analyze (flatten SCF flight-recorder runs into a tidy per-
# iteration table for a notebook / DuckDB / statistical model / symbolic
# regression) imports these lazily; the harness itself writes stdlib JSON and
# needs none of them. Install with: gradwave[bench].
bench = [
    "pandas>=3.0.3",
    "pyarrow>=17",
    "duckdb>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist",
    "pytest-split>=0.8",  # shard the CI standard tier across parallel runners
    "pytest-timeout",  # per-test wall cap so a hung test fails fast (traceback) instead of the 6h job default
    "ruff>=0.6",
    "codespell>=2.3",  # spell-check code/comments/docstrings (pre-commit hook; config in [tool.codespell])
    "sympy>=1.12",
    "pre-commit>=3.5",
    # libxc oracle for the r2SCAN pointwise tests (bundles libxc via its wheel);
    # tests importorskip it, so it is optional — this just enables them in CI.
    "pyscf>=2.4",
    "import-linter>=2.13",
    "hypothesis>=6.160.0",
    "ty>=0.0.64",
    "monkeytype>=23.3.0",
    "autotyping>=24.9.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[project.scripts]
gradwave = "gradwave.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gradwave"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -n auto parallelizes across cores via pytest-xdist; pass -n0 to disable when
# debugging a single test and interleaved output gets in the way.
# NOTE: the per-test wall cap (--timeout, pytest-timeout) is applied in the CI
# workflow command, NOT here — a global addopts timeout would also fire on the
# manual `torture` tier (tests intentionally >10 min). See .github/workflows/ci.yml.
addopts = "-q -n auto"
markers = [
    "standard: seconds-class integration tests, excluded from the fast gate",
    "slow: minutes-class QE-comparison tests, nightly or pre-release",
    "torture: tests over ~10 minutes (spin and FD monsters), run manually when their subsystem changes",
    "gpu: requires CUDA device",
]
# Tiers. A test carries at most one tier
# marker; unmarked tests are the fast tier by definition.
#   fast gate (<2 min):  pytest -m "not standard and not slow and not torture and not gpu"
#   standard / CI:       pytest -m "not slow and not torture and not gpu"
#   nightly:             pytest -m "not torture and not gpu"
#   torture (manual):    pytest -m torture

[tool.ty.environment]
python = ".venv"

[tool.ty.terminal]
# Findings in the untyped bulk of the codebase are demoted to warnings below,
# not silenced; don't let those (expected, pre-existing) warnings fail the
# exit code the way an actual error still does.
error-on-warning = false

[tool.ty.rules]
# Gradual typing rollout (see CLAUDE.md): "warn" everywhere by default so the
# many pre-existing findings across the untyped bulk of the codebase stay
# visible (not silenced) without failing CI — this rollout does not (yet) ask
# anyone to clean those up. The override below raises the same rules back to
# "error" for the growing, explicitly-typed file list, so a regression THERE
# still fails the build. A single override block is the obviously-editable
# spot to grow as more files get typed in later phases.
all = "warn"

[[tool.ty.overrides]]
include = [
    "src/gradwave/api",
    "src/gradwave/calculator.py",
    "src/gradwave/inputs",
    "src/gradwave/cli.py",
