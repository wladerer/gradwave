# Ferromagnetic bcc Fe (Im-3m, nspin=2 — the physical ground state) for the
# collinear-spin block-diagonalization demo.
structure:
  cell: [[-1.435, 1.435, 1.435], [1.435, -1.435, 1.435], [1.435, 1.435, -1.435]]
  positions: {frac: [[0.0, 0.0, 0.0]]}
  species: [Fe]

pseudopotentials:
  dir: /home/wladerer/github/gradwave/benchmarks/delta_gauge/pseudos
  map: {Fe: Fe.upf}

ecut: 500.0
xc: pbe
nspin: 2
start_mag: {Fe: 0.4}          # FM seed (matches examples/fe_energy_gate.py)
kpoints: {mesh: [8, 8, 8]}
smearing: {type: gaussian, width: 0.1}

scf: {etol: 1.0e-6, rhotol: 1.0e-5}
task: scf
output: {dir: /home/wladerer/github/gradwave/experiments/symbolic/out_fe_fm_scf}
