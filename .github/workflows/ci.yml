name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether this change can affect test/lint outcomes. Docs-, benchmark-,
  # and notebook-only PRs execute no product code, so the ~50-min standard tier
  # is pure waste on them. `inert_only` is true iff EVERY changed file matches an
  # inert pattern below (predicate-quantifier: every). It fails safe: any file
  # outside the inert set — a new top-level file, a workflow edit, pyproject,
  # src/, tests/ — flips inert_only to false and runs the full suite. The `ci-ok`
  # gate still always runs and reports, so the required check is never left
  # pending on a skipped PR.
  #
  # NB: an only-negated filter (`!docs/**`, `!benchmarks/**`, ...) does NOT work
  # here — a benchmarks/ file matches `!docs/**` (it is "not in docs"), so ORing
  # the negations makes every path match. The `every` quantifier over positive
  # inert globs is the correct idiom.
  changes:
    runs-on: ubuntu-latest
    outputs:
      inert_only: ${{ steps.filter.outputs.inert }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            inert:
              - 'docs/**'
              - 'benchmarks/**'
              - 'ideas/**'
              - '.claude/**'
              - '**/*.md'
              - 'LICENSE'
              - '.gitignore'

  lint:
    needs: changes
    if: ${{ needs.changes.outputs.inert_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Ruff
        run: uv run ruff check

      - name: Import contracts
        run: uv run lint-imports

  test:
    needs: changes
    if: ${{ needs.changes.outputs.inert_only != 'true' }}
    # The standard tier is fp64/CPU-bound; on the free public `ubuntu-latest`
    # runner a single job takes ~90 min. Shard it across parallel runners
    # (public repos get generous free concurrency) so wall-clock is ~1/N.
    # pytest-split balances by test count (or by .test_durations if present);
    # -n auto still parallelizes within each shard.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Standard test tier (shard ${{ matrix.group }}/4)
        run: >-
          uv run pytest -m "not slow and not torture and not gpu"
          --splits 4 --group ${{ matrix.group }}

  # Single required-status gate. Always runs (so the required check is reported
  # even when lint/test are skipped), and is green iff neither lint nor test
  # FAILED — a `skipped` result (docs/benchmark-only PR, no code touched) counts
  # as OK. Failure or cancellation of either fails the gate.
  ci-ok:
    if: always()
    needs: [changes, lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify lint and all test shards succeeded (or were skipped)
        run: |
          lint='${{ needs.lint.result }}'
          test='${{ needs.test.result }}'
          echo "inert_only=${{ needs.changes.outputs.inert_only }}  lint=$lint  test=$test"
          for result in "$lint" "$test"; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::CI gate failed (lint=$lint test=$test)"; exit 1 ;;
            esac
          done
          echo "CI gate passed."
