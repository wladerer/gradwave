name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide whether this change can affect test/lint outcomes. Docs-, benchmark-,
  # and notebook-only PRs execute no product code, so the ~50-min standard tier
  # is pure waste on them. `run_tests` is 'true' unless EVERY changed file is
  # inert (matches one of the inert path globs). Fails safe: any file outside the
  # inert set — a new top-level file, a workflow edit, pyproject, src/, tests/ —
  # sets run_tests=true and runs the full suite. The `ci-ok` gate still always
  # runs and reports, so the required check is never left pending on a skip.
  #
  # Done in plain bash rather than dorny/paths-filter: an only-negated filter
  # (`!docs/**`...) matches everything (a benchmarks file is "not in docs"), and
  # its `predicate-quantifier: every` requires a file to match ALL patterns at
  # once (impossible across disjoint dirs) — both silently never skip. An
  # explicit "is every changed file inert?" loop is unambiguous and testable.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.decide.outputs.run_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --name-only "$BASE_SHA...HEAD")
          elif [ -n "$BEFORE_SHA" ] && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            files=$(git diff --name-only "$BEFORE_SHA" HEAD)
          else
            files="__run_all__"   # first push / unknown base: fail safe
          fi
          run=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/*|benchmarks/*|ideas/*|.claude/*|*.md|LICENSE|.gitignore) ;;
              *) run=true; break ;;
            esac
          done <<< "$files"
          echo "changed files:"; echo "$files"
          echo "run_tests=$run"
          echo "run_tests=$run" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: ${{ needs.changes.outputs.run_tests == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Ruff
        run: uv run ruff check

      - name: Import contracts
        run: uv run lint-imports

  test:
    needs: changes
    if: ${{ needs.changes.outputs.run_tests == 'true' }}
    # The standard tier is fp64/CPU-bound; on the free public `ubuntu-latest`
    # runner a single job takes ~90 min. Shard it across parallel runners
    # (public repos get generous free concurrency) so wall-clock is ~1/N.
    # pytest-split balances by test count (or by .test_durations if present);
    # -n auto still parallelizes within each shard.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Standard test tier (shard ${{ matrix.group }}/4)
        run: >-
          uv run pytest -m "not slow and not torture and not gpu"
          --splits 4 --group ${{ matrix.group }}

  # Single required-status gate. Always runs (so the required check is reported
  # even when lint/test are skipped), and is green iff neither lint nor test
  # FAILED — a `skipped` result (docs/benchmark-only PR, no code touched) counts
  # as OK. Failure or cancellation of either fails the gate.
  ci-ok:
    if: always()
    needs: [changes, lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify lint and all test shards succeeded (or were skipped)
        run: |
          lint='${{ needs.lint.result }}'
          test='${{ needs.test.result }}'
          echo "run_tests=${{ needs.changes.outputs.run_tests }}  lint=$lint  test=$test"
          for result in "$lint" "$test"; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::CI gate failed (lint=$lint test=$test)"; exit 1 ;;
            esac
          done
          echo "CI gate passed."
